<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAM! Home Run Tracker</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-logo">
        <div class="header-logo-text">SLAM <span>Home Run</span></div>
      </a>
      <h1 class="header-title">Home Run Tracker</h1>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- STEP 1: Choose Grade -->
    <section id="step-grade" class="step-section active">
      <div class="step-card">
        <h2 class="step-heading">1️⃣ Select Your Grade</h2>
        <p class="step-subtitle">Choose the grade you teach</p>
        <div class="grade-grid" id="grade-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- STEP 2: Choose Teacher -->
    <section id="step-teacher" class="step-section" style="display:none">
      <div class="step-card">
        <button class="back-btn" onclick="HR.showStep('grade')">← Back to Grades</button>
        <h2 class="step-heading">2️⃣ Select Your Name</h2>
        <p class="step-subtitle" id="teacher-subtitle">Teachers</p>
        <div class="teacher-grid" id="teacher-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- STEP 3: Mark Home Runs -->
    <section id="step-students" class="step-section" style="display:none">
      <div class="step-card">
        <button class="back-btn" onclick="HR.showStep('teacher')">← Back to Teachers</button>
        <h2 class="step-heading">3️⃣ Mark Home Runs</h2>
        <p class="step-subtitle" id="student-subtitle"></p>
        <div class="student-date-row">
          <label for="date-input">Date: </label>
          <input type="date" id="date-input" />
        </div>
        <div class="student-list" id="student-list">
          <!-- Populated by JS -->
        </div>
        <div class="submit-row">
          <button class="submit-btn" id="submit-btn" onclick="HR.submitAll()" disabled>
            Submit & Email Coaches
          </button>
          <span class="submit-status" id="submit-status"></span>
        </div>
      </div>
    </section>

    <!-- SUCCESS SCREEN -->
    <section id="step-success" class="step-section" style="display:none">
      <div class="step-card success-card">
        <div class="success-icon">✅</div>
        <h2 class="step-heading">Home Runs Submitted!</h2>
        <p class="step-subtitle" id="success-message">The coaches have been notified.</p>
        <button class="submit-btn" onclick="HR.reset()">Submit Another</button>
      </div>
    </section>

    <!-- LOADING STATE -->
    <div id="loading-overlay" class="loading-overlay" style="display:none">
      <div class="spinner-ring"></div>
      <span class="loading-label">Loading...</span>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>SLAM! Nevada Home Run Tracker &copy; 2026</p>
    <p class="footer-note">Athletic Director: Coach Kenny</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
