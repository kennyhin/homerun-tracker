<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAM! Home Run Tracker</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .logo span { color: #E86C00; }
    .tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 30px;
    }
    .launch-btn {
      display: inline-block;
      background: #E86C00;
      color: #fff;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .launch-btn:hover {
      background: #d05e00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(232,108,0,0.3);
    }
    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">SLAM <span>Home Run</span></div>
    <p class="tagline">Track your athletes' daily home runs — all work done!</p>
    <a href="home.html" class="launch-btn">🚀 Open Home Run Tracker</a>
    <p class="footer">SLAM! Nevada &copy; 2026 — Athletic Director: Coach Kenny</p>
  </div>
</body>
</html>
