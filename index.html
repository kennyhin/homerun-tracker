<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAM! Home Run Tracker</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <div class="logo-mark">🏃</div>
        <div class="header-logo-text">SLAM<span>Home Run</span></div>
      </div>
      <h1 class="header-title">Home Run Tracker</h1>
    </div>
  </header>

  <main class="main-content">

    <!-- Step 1: Grade -->
    <section id="step-grade" class="step-section active">
      <div class="step-card">
        <div class="step-number">1️⃣</div>
        <h2 class="step-heading">Select Your Grade</h2>
        <p class="step-subtitle">Choose the grade you teach</p>
        <div class="grade-grid" id="grade-grid"></div>
      </div>
    </section>

    <!-- Step 2: Teacher -->
    <section id="step-teacher" class="step-section" style="display:none">
      <div class="step-card">
        <button class="back-btn" onclick="HR.backToGrade()">← Back</button>
        <div class="step-number">2️⃣</div>
        <h2 class="step-heading">Who Are You?</h2>
        <p class="step-subtitle" id="teacher-subtitle"></p>
        <div class="teacher-grid" id="teacher-grid"></div>
      </div>
    </section>

    <!-- Step 3: Players -->
    <section id="step-players" class="step-section" style="display:none">
      <div class="step-card">
        <button class="back-btn" onclick="HR.backToTeacher()">← Back</button>
        <div class="step-number">3️⃣</div>
        <h2 class="step-heading">Mark Home Runs</h2>
        <div class="player-date-row">
          <label for="date-input">📅 Date: </label>
          <input type="date" id="date-input" />
        </div>
        <div class="player-list" id="player-list"></div>
        <p class="step-subtitle" id="players-subtitle"></p>
        <div class="submit-row">
          <button class="submit-btn" id="submit-btn" onclick="HR.submitAll()" disabled>
            Submit &amp; Email Coaches
          </button>
        </div>
      </div>
    </section>

    <!-- Step 4: Success -->
    <section id="step-success" class="step-section" style="display:none">
      <div class="step-card success-card">
        <div class="success-checkmark">
          <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14 27l7 7 17-17"/>
          </svg>
        </div>
        <h2 class="step-heading">Home Runs Submitted!</h2>
        <p class="step-subtitle" id="success-message"></p>
        <div id="success-summary" class="success-summary"></div>
        <button class="submit-btn" onclick="HR.reset()">Submit Another</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>SLAM! Nevada Home Run Tracker &copy; 2026</p>
    <p class="footer-note">Athletic Department: Coach Kenny</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
